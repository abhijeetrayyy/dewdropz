name: Recover abandoned carts

# The third scheduled sweep, and the last one that had no scheduler. The route
# has existed with a working handler and a Bearer gate; nothing ever called it,
# so no abandoned cart has ever been recovered.
#
# Same reasoning as the two workflows beside it: Vercel Hobby caps crons at once
# per day and rejects a more frequent expression at deploy time, so the schedule
# lives here.
#
# TIMING. A cart counts as abandoned 6 hours after its last activity and is
# given up on after 14 days (ABANDONED_AFTER_HOURS / ABANDONED_GIVE_UP_DAYS in
# lib/abandonedCarts.ts), so the sweep only needs to be hourly — finer buys
# nothing, and daily would let a reminder land a day and a half after the
# customer walked away.
#
# The hours are deliberate. GitHub cron is UTC, and 03:30–16:30 UTC is
# 09:00–22:00 IST, so this fires on the hour, IST, through the waking day. This
# shop's customers are in India; a cart reminder at 4am is a worse experience
# than one that waits until breakfast, and mail sent into the small hours is
# what teaches an inbox to treat the sender as spam. A cart abandoned at
# midnight is picked up at 09:00 rather than 06:00 — well inside the 14-day
# window, and nothing is skipped.
#
# Safe to run repeatedly, and safe to have a run cut short. Each cart is stamped
# before its email goes out and the query only looks at unstamped carts, so an
# overlapping or timed-out run resumes where the last one stopped instead of
# mailing anyone twice.
#
# Requires the same CRON_SECRET repository secret as its two siblings, matching
# the value in the Vercel project's environment variables.

on:
  schedule:
    - cron: "30 3-16 * * *"
  # Lets you run the sweep by hand from the Actions tab — pair it with a
  # ?dryRun=1 curl first if you have never pointed this at a real cart list.
  workflow_dispatch:

# A slow sweep should delay the next run, not race it.
concurrency:
  group: recover-abandoned-carts
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Email abandoned carts
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://dewdropz.vercel.app' }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::CRON_SECRET repository secret is not set." >&2
            exit 1
          fi

          # No --fail-with-body here, unlike the sibling workflows: a 503 is an
          # expected answer that must not fail the job, so the status is read
          # and branched on explicitly and curl only errors on a dead network.
          status=$(curl -sS \
            -o response.json -w '%{http_code}' \
            --retry 3 --retry-delay 5 --retry-connrefused --max-time 120 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/recover-abandoned-carts") || {
              echo "::error::Request never completed." >&2
              exit 1
            }

          case "${status}" in
            200)
              echo "HTTP 200"
              cat response.json
              ;;
            503)
              # RESEND_API_KEY is unset, so the route refused rather than
              # consuming the recovery list silently. A warning, not a failure:
              # this is the correct behaviour until mail is configured, and a
              # red X fourteen times a day would train everyone to ignore it.
              echo "::warning::Cart recovery is not configured yet — the route declined to run."
              cat response.json
              ;;
            *)
              echo "::error::Unexpected HTTP ${status}." >&2
              cat response.json >&2 || true
              exit 1
              ;;
          esac
